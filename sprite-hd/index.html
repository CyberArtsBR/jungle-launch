<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Jungle Launch v0.3.3 — Sprite HD Edition</title>
  <style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#07100a;font-family:Inter,Segoe UI,Arial,sans-serif;color:#fff}
body{user-select:none;-webkit-user-select:none}
#wrap{height:100%;display:grid;place-items:center;background:
  radial-gradient(circle at 50% 28%,rgba(53,105,71,.38),transparent 42%),
  radial-gradient(circle at 15% 78%,rgba(18,45,28,.52),transparent 34%),
  linear-gradient(180deg,#172a1c,#07100a 74%)}
canvas{width:min(100vw,177.78vh);height:min(56.25vw,100vh);max-width:100vw;max-height:100vh;display:block;background:#91dcff;border-radius:18px;box-shadow:0 30px 90px rgba(0,0,0,.62),inset 0 0 0 1px rgba(255,255,255,.05);touch-action:none}
#badge{position:fixed;left:12px;bottom:10px;font-size:12px;opacity:.65;pointer-events:none}

</style>
</head>
<body>
  <div id="wrap"><canvas id="game" width="1280" height="720" aria-label="Jungle Launch game"></canvas></div>
  <div id="badge">Jungle Launch • v0.3.3 Sprite HD edition</div>
  <script>

/* ===== config.js ===== */
window.JL = window.JL || {};
JL.CONFIG = {
  WIDTH:1280, HEIGHT:720, GROUND_Y:598, METERS_PER_PX:0.115,
  FIXED_DT:1/120, MAX_FRAME_DT:0.05,
  GRAVITY:900,
  PLAYER_RADIUS:28,
  LAUNCH:{minAngle:10,maxAngle:60,minSpeed:950,maxBonus:1450,powerExponent:2.05,perfectThreshold:.955,perfectMultiplier:1.10},
  AIR:{baseDrag:0.00075,highSpeedDrag:0.0000000022},
  GROUND:{defaultRetention:.70,diveRetention:.86,minRebound:105},
  CAMERA:{baseLead:.34,fastLead:.22,zoomMin:.80,zoomMax:1.0,verticalFollow:.34},
  BIOMES:[
    {m:0,name:'TREEHOUSE FOREST',sky1:'#85d5fb',sky2:'#d9f5ff',far:'#84ad8b',mid:'#4d8256',near:'#2b5d39',ground:'#6d431f'},
    {m:700,name:'DEEP JUNGLE',sky1:'#75c9ca',sky2:'#d6f3e9',far:'#6b9d76',mid:'#3e704a',near:'#204a30',ground:'#5e3a1b'},
    {m:1800,name:'JUNGLE RIVER',sky1:'#79d6e6',sky2:'#e1fbff',far:'#77a78c',mid:'#447960',near:'#245c4b',ground:'#73502b'},
    {m:3600,name:'ANCIENT RUINS',sky1:'#b8cec0',sky2:'#f0f4ed',far:'#83987c',mid:'#5d7256',near:'#384b3a',ground:'#6d624e'},
    {m:6500,name:'HIGH CANOPY',sky1:'#8cbfff',sky2:'#e2efff',far:'#8ab28a',mid:'#56895d',near:'#2e6840',ground:'#68522c'},
    {m:10000,name:'MYSTIC JUNGLE',sky1:'#897bdc',sky2:'#e3d7fa',far:'#7079a3',mid:'#4d5588',near:'#303762',ground:'#554468'}
  ]
};

JL.storage={get(k){try{return window.localStorage?localStorage.getItem(k):null}catch(e){return null}},set(k,v){try{if(window.localStorage)localStorage.setItem(k,v)}catch(e){}}};


/* ===== rng.js ===== */
window.JL = window.JL || {};
JL.RNG = class RNG{
  constructor(seed=1){ this.state=(seed>>>0)||1; }
  next(){ let x=this.state; x^=x<<13; x^=x>>>17; x^=x<<5; this.state=x>>>0; return this.state/4294967296; }
  range(a,b){ return a+(b-a)*this.next(); }
  int(a,b){ return Math.floor(this.range(a,b+1)); }
  pick(arr){ return arr[Math.floor(this.next()*arr.length)]; }
};
JL.hashSeed = function(input){
  let h=2166136261>>>0; const s=String(input);
  for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); }
  return h>>>0;
};


/* ===== physics.js ===== */
window.JL = window.JL || {};
JL.clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
JL.lerp=(a,b,t)=>a+(b-a)*t;
JL.mag=(x,y)=>Math.hypot(x,y);
JL.segmentCircleHit=function(ax,ay,bx,by,cx,cy,r){
  const abx=bx-ax, aby=by-ay, acx=cx-ax, acy=cy-ay;
  const d=abx*abx+aby*aby;
  let t=d>0?(acx*abx+acy*aby)/d:0; t=JL.clamp(t,0,1);
  const px=ax+abx*t, py=ay+aby*t;
  const dx=px-cx, dy=py-cy;
  return dx*dx+dy*dy<=r*r;
};
JL.Player = class Player{
  constructor(x,y){ this.reset(x,y); }
  reset(x,y){
    Object.assign(this,{x,y,px:x,py:y,vx:0,vy:0,r:JL.CONFIG.PLAYER_RADIUS,rot:0,boosts:3,dive:100,diving:false,
      combo:0,comboTimer:0,history:[],runBananas:0,maxHeight:0,topSpeed:0,bounces:0,encounters:0,shield:0,trail:[],squash:0,limb:0,alive:true});
  }
  launch(angleDeg,power){
    const L=JL.CONFIG.LAUNCH, rad=angleDeg*Math.PI/180;
    const shaped=Math.pow(power,L.powerExponent);
    let speed=L.minSpeed+shaped*L.maxBonus;
    const perfect=power>=L.perfectThreshold;
    if(perfect) speed*=L.perfectMultiplier;
    this.vx=Math.cos(rad)*speed; this.vy=-Math.sin(rad)*speed;
    return {speed,perfect};
  }
  boost(){ if(this.boosts<=0)return false; this.boosts--; this.vx+=210; this.vy-=540; this.diving=false; this.squash=.32; return true; }
  diveNow(){ if(this.dive<30)return false; this.dive-=32; this.vx+=110; this.vy+=720; this.diving=true; this.squash=.28; return true; }
  step(dt,world){
    this.px=this.x; this.py=this.y;
    this.comboTimer=Math.max(0,this.comboTimer-dt); if(this.comboTimer===0)this.combo=0;
    this.dive=JL.clamp(this.dive+dt*16,0,100);
    this.vy+=JL.CONFIG.GRAVITY*dt;
    const speed=Math.hypot(this.vx,this.vy);
    const drag=JL.CONFIG.AIR.baseDrag+JL.CONFIG.AIR.highSpeedDrag*speed*speed;
    this.vx*=Math.max(0,1-drag*dt*60);
    this.vy*=Math.max(0,1-drag*.12*dt*60);
    this.x+=this.vx*dt; this.y+=this.vy*dt;
    this.rot += (Math.atan2(this.vy,Math.max(1,this.vx))-this.rot)*Math.min(1,dt*7);
    this.maxHeight=Math.max(this.maxHeight,JL.CONFIG.GROUND_Y-this.y);
    this.topSpeed=Math.max(this.topSpeed,Math.max(0,this.vx*JL.CONFIG.METERS_PER_PX));
    this.squash=Math.max(0,this.squash-dt*1.5); this.limb+=dt*JL.clamp(this.vx/170,2,11);
    this.trail.push({x:this.x,y:this.y,t:1}); if(this.trail.length>40)this.trail.shift(); this.trail.forEach(p=>p.t-=dt*1.9);

    const gy=world.groundAt(this.x), surface=world.surfaceAt(this.x);
    if(this.y+this.r>=gy && this.vy>0){
      this.y=gy-this.r;
      const impact=this.vy;
      const shallow=Math.abs(this.vy)/(Math.abs(this.vx)+1)<.34;
      let retention=this.diving?JL.CONFIG.GROUND.diveRetention:JL.CONFIG.GROUND.defaultRetention;
      retention*=surface.bounce;
      if(shallow) retention*=.82;
      this.vy=-impact*retention;
      let horizontalRetention=surface.friction;
      if(this.diving){ this.vx*=1.09; this.vx+=Math.min(180,impact*.12); }
      else this.vx*=horizontalRetention;
      this.diving=false; this.bounces++; this.squash=JL.clamp(impact/850,.15,.48);
      if(Math.abs(this.vy)<JL.CONFIG.GROUND.minRebound) this.vy=-Math.max(JL.CONFIG.GROUND.minRebound,this.vx*.065);
      return {groundImpact:true,impact,surface,shallow};
    }
    return null;
  }
};


/* ===== encounters.js ===== */
window.JL = window.JL || {};
JL.ENCOUNTERS = {
  banana:{r:20,good:true},
  mushroom:{r:38,good:true},
  gorilla:{r:44,good:true},
  toucan:{r:38,good:true,aerial:true},
  jaguar:{r:43,good:true},
  vine:{r:42,good:true},
  sloth:{r:42,bad:true},
  turtle:{r:36,good:true},
  rock:{r:38,good:true},
  puddle:{r:48,bad:true},
  idol:{r:42,good:true,rare:true}
};

JL.resolveEncounter = function(player,o,game){
  if(o.hit)return;
  o.hit=true;
  const now=game.simTime;
  const bad=JL.ENCOUNTERS[o.type]?.bad;

  if(o.type==='banana'){
    player.runBananas++;
    player.vx+=24;
    game.fxBurst(o.x,o.y,10,'banana');
    game.audioPulse('pickup');
    return;
  }

  if(bad && player.shield>0){
    player.shield--;
    game.showBanner('SHIELD SAVE!','Bad encounter blocked',.8);
    game.hitStop(.045);
    game.fxBurst(o.x,o.y,24,'shield');
    return;
  }

  player.encounters++;
  player.combo=player.comboTimer>0?player.combo+1:1;
  player.comboTimer=2.55;
  player.history.push({type:o.type,t:now});
  player.history=player.history.filter(h=>now-h.t<8).slice(-6);
  const comboMult=1+Math.min(player.combo-1,7)*.075;
  const vx=player.vx;

  switch(o.type){
    case 'gorilla': {
      const target=Math.max(vx*1.09,1650)*comboMult;
      player.vx=Math.min(3400,target);
      player.vy=Math.min(player.vy,-260);
      game.impact('GORILLA PUNCH!',`COMBO x${player.combo}`,o,14,'impact',.065);
      break;
    }
    case 'toucan': {
      player.vx=Math.max(vx,1250)+150;
      player.vy=Math.min(player.vy,-1020*comboMult);
      game.impact('TOUCAN LIFT!',`COMBO x${player.combo}`,o,8,'feather',.04);
      break;
    }
    case 'jaguar': {
      const target=Math.max(vx*1.12,2150)*comboMult;
      player.vx=Math.min(3900,target);
      player.vy=Math.min(player.vy,-120);
      game.impact('JAGUAR DASH!',`COMBO x${player.combo}`,o,12,'speed',.055);
      break;
    }
    case 'mushroom': {
      player.vy=Math.min(player.vy,-1120*comboMult);
      player.vx*=1.035;
      game.impact('MEGA BOUNCE!',`COMBO x${player.combo}`,o,9,'spore',.045);
      break;
    }
    case 'vine': {
      player.vx=Math.max(player.vx,1450)+260;
      player.vy=-1180;
      game.impact('VINE SLING!',`COMBO x${player.combo}`,o,9,'leaf',.045);
      break;
    }
    case 'rock': {
      player.vx=Math.max(player.vx,1150)+160;
      player.vy=Math.min(player.vy,-360);
      game.impact('ROCK RAMP!',`COMBO x${player.combo}`,o,7,'dust',.035);
      break;
    }
    case 'turtle': {
      player.shield=Math.min(2,player.shield+1);
      player.vy=Math.min(player.vy,-420);
      game.impact('TURTLE SHELL!','Next bad hit can be blocked',o,6,'shield',.035);
      break;
    }
    case 'sloth': {
      player.vx*=.64; player.vy*=.78;
      game.impact('SLOTH!','Momentum drained',o,5,'dust',.025);
      break;
    }
    case 'puddle': {
      player.vx*=.72; player.vy-=80;
      game.impact('SPLASH!','Water drag',o,6,'water',.025);
      break;
    }
    case 'idol': {
      game.specialWindow={type:'idol',timer:.72,max:.72,used:false};
      game.showBanner('ANCIENT SPECIAL!','PRESS BOOST NOW!',.72);
      game.hitStop(.035);
      game.fxBurst(o.x,o.y,30,'mystic');
      break;
    }
  }

  const seq=player.history.slice(-3).map(h=>h.type).join('>');
  if(seq==='toucan>gorilla>jaguar'){
    player.vx=Math.min(4300,Math.max(player.vx,3200));
    player.vy=Math.min(player.vy,-720);
    player.boosts=Math.min(3,player.boosts+1);
    player.history=[];
    game.showBanner('JUNGLE FURY!','TOUCAN → GORILLA → JAGUAR',1.8);
    game.hitStop(.12);
    game.screenShake=20;
    game.fxBurst(player.x,player.y,70,'special');
  }
};


/* ===== world.js ===== */
window.JL = window.JL || {};
JL.World = class World{
  constructor(seed){ this.reset(seed); }
  reset(seed){
    this.seed=seed>>>0; this.rng=new JL.RNG(this.seed); this.objects=[]; this.spawnX=760; this.terrainPatches=[]; this.lastTypes=[];
    this.decorSeed=new JL.RNG(this.seed^0x9e3779b9);
    this.generateTerrain(16000);
  }
  metersAt(x,startX){ return Math.max(0,(x-startX)*JL.CONFIG.METERS_PER_PX); }
  biomeAt(m){ let b=JL.CONFIG.BIOMES[0]; for(const s of JL.CONFIG.BIOMES)if(m>=s.m)b=s; return b; }
  groundAt(x){ return JL.CONFIG.GROUND_Y + Math.sin(x*.0030)*10 + Math.sin(x*.0081)*5 + Math.sin(x*.0009+1.7)*12; }
  generateTerrain(maxMeters){
    const endPx=maxMeters/JL.CONFIG.METERS_PER_PX;
    let x=1000;
    while(x<endPx){
      x+=this.rng.range(900,1800);
      const roll=this.rng.next();
      let type='dirt';
      if(roll<.18)type='mud'; else if(roll<.34)type='rock'; else if(roll<.44)type='water'; else if(roll<.55)type='moss';
      const len=this.rng.range(180,430);
      this.terrainPatches.push({x1:x,x2:x+len,type}); x+=len;
    }
  }
  surfaceAt(x){
    let type='dirt';
    for(const p of this.terrainPatches){ if(x>=p.x1&&x<=p.x2){type=p.type;break;} if(p.x1>x)break; }
    if(type==='mud')return {type,bounce:.58,friction:.77};
    if(type==='water')return {type,bounce:.48,friction:.69};
    if(type==='rock')return {type,bounce:1.08,friction:.985};
    if(type==='moss')return {type,bounce:.90,friction:.94};
    return {type,bounce:1,friction:.955};
  }
  nextSpacing(speedMps){
    const reactionPx=JL.clamp(speedMps*8.8,300,920);
    return reactionPx*this.rng.range(.75,1.14);
  }
  chooseType(m,speedMps){
    const r=this.rng.next();
    let table;
    if(m<700) table=[['banana',.18],['mushroom',.18],['gorilla',.17],['toucan',.13],['turtle',.10],['rock',.08],['sloth',.06],['jaguar',.07],['vine',.03]];
    else if(m<1800) table=[['banana',.14],['mushroom',.12],['gorilla',.14],['toucan',.13],['jaguar',.12],['vine',.12],['sloth',.08],['turtle',.07],['rock',.05],['idol',.03]];
    else if(m<3600) table=[['banana',.13],['toucan',.12],['jaguar',.11],['puddle',.12],['turtle',.09],['gorilla',.10],['mushroom',.08],['sloth',.08],['vine',.08],['rock',.06],['idol',.03]];
    else table=[['banana',.12],['toucan',.12],['jaguar',.13],['gorilla',.12],['mushroom',.09],['vine',.11],['turtle',.07],['sloth',.07],['rock',.08],['puddle',.05],['idol',.04]];
    // avoid too many bad encounters in a row
    if(this.lastTypes.slice(-2).some(t=>t==='sloth'||t==='puddle')) table=table.filter(([t])=>t!=='sloth'&&t!=='puddle');
    let total=table.reduce((a,b)=>a+b[1],0), acc=0, rr=r*total;
    for(const [type,w] of table){ acc+=w; if(rr<=acc){ this.lastTypes.push(type); this.lastTypes=this.lastTypes.slice(-4); return type; } }
    return 'banana';
  }
  spawnAhead(player,startX,lookAhead=4700){
    const speed=Math.max(30,player.vx*JL.CONFIG.METERS_PER_PX);
    while(this.spawnX<player.x+lookAhead){
      this.spawnX+=this.nextSpacing(speed);
      const m=this.metersAt(this.spawnX,startX);
      const type=this.chooseType(m,speed);
      const def=JL.ENCOUNTERS[type];
      let y=this.groundAt(this.spawnX)-30;
      if(type==='toucan') y=this.rng.range(290,455);
      else if(type==='banana') y=this.rng.range(235,500);
      else if(type==='vine') y=this.groundAt(this.spawnX)-84;
      else if(type==='sloth') y=this.groundAt(this.spawnX)-106;
      else if(type==='puddle'||type==='rock') y=this.groundAt(this.spawnX)-12;
      else if(type==='idol') y=this.groundAt(this.spawnX)-45;
      this.objects.push({type,x:this.spawnX,y,r:def.r,hit:false,phase:this.rng.range(0,Math.PI*2)});

      // authored banana arcs occasionally
      if(type!=='banana'&&this.rng.next()<.18){
        const n=this.rng.int(3,6), arc=this.rng.range(30,90);
        for(let i=1;i<=n;i++){
          const bx=this.spawnX+i*54, by=y-40-Math.sin((i/(n+1))*Math.PI)*arc;
          this.objects.push({type:'banana',x:bx,y:by,r:JL.ENCOUNTERS.banana.r,hit:false,phase:this.rng.range(0,6)});
        }
        this.spawnX+=n*54;
      }
    }
  }
  cleanup(cameraX){ this.objects=this.objects.filter(o=>o.x>cameraX-520); }
};


/* ===== renderer.js ===== */
window.JL = window.JL || {};


JL.Renderer = class Renderer{
  constructor(canvas){
    this.canvas=canvas; this.ctx=canvas.getContext('2d'); this.W=JL.CONFIG.WIDTH; this.H=JL.CONFIG.HEIGHT;
    this.patterns=this.buildPatterns(); this.sprites=this.buildSprites();
  }
  roundRect(x,y,w,h,r,fill=true,stroke=false){ const c=this.ctx;if(w<2*r)r=w/2;if(h<2*r)r=h/2;c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();if(fill)c.fill();if(stroke)c.stroke(); }
  worldToScreen(game,x,y){ const cam=game.camera; return {x:(x-cam.x)*cam.zoom+this.W/2,y:(y-cam.y)*cam.zoom+this.H/2}; }
  mix(a,b,t){ const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16); const ar=(pa>>16)&255,ag=(pa>>8)&255,ab=pa&255, br=(pb>>16)&255,bg=(pb>>8)&255,bb=pb&255; return `rgb(${Math.round(ar+(br-ar)*t)},${Math.round(ag+(bg-ag)*t)},${Math.round(ab+(bb-ab)*t)})`; }
  hiSprite(drawW,drawH,painter,scale=4){ const cv=document.createElement('canvas'); cv.width=Math.ceil(drawW*scale); cv.height=Math.ceil(drawH*scale); const c=cv.getContext('2d'); c.scale(scale,scale); c.imageSmoothingEnabled=true; painter(c,drawW,drawH); return {img:cv,dw:drawW,dh:drawH,ax:drawW/2,ay:drawH/2}; }
  buildPatterns(){
    const mk=(w,h,paint)=>{ const cv=document.createElement('canvas'); cv.width=w; cv.height=h; const c=cv.getContext('2d'); paint(c,w,h); return c.createPattern(cv,'repeat'); };
    return {
      dirt: mk(180,120,(c,w,h)=>{ const g=c.createLinearGradient(0,0,0,h); g.addColorStop(0,'#80502b'); g.addColorStop(.5,'#61391f'); g.addColorStop(1,'#422513'); c.fillStyle=g; c.fillRect(0,0,w,h); for(let i=0;i<260;i++){ const x=Math.random()*w,y=Math.random()*h,r=Math.random()*3+1; c.fillStyle=i%6===0?'rgba(255,230,150,.08)':i%2?'rgba(35,16,6,.12)':'rgba(255,255,255,.05)'; c.beginPath(); c.arc(x,y,r,0,Math.PI*2); c.fill(); } }),
      grass: mk(120,80,(c,w,h)=>{ c.fillStyle='rgba(74,125,58,.2)'; c.fillRect(0,0,w,h); for(let i=0;i<180;i++){ const x=Math.random()*w,y=38+Math.random()*42,len=4+Math.random()*12; c.strokeStyle=i%4===0?'rgba(148,209,102,.42)':i%3===0?'rgba(53,111,48,.48)':'rgba(101,170,72,.45)'; c.lineWidth=1+Math.random()*1.2; c.beginPath(); c.moveTo(x,y); c.lineTo(x+(Math.random()*4-2),y-len); c.stroke(); } }),
      leaf: mk(150,110,(c,w,h)=>{ c.fillStyle='rgba(0,0,0,0)'; c.fillRect(0,0,w,h); for(let i=0;i<28;i++){ const x=Math.random()*w,y=Math.random()*h,rx=8+Math.random()*12,ry=3+Math.random()*7; c.save(); c.translate(x,y); c.rotate(Math.random()*Math.PI); c.fillStyle=i%3===0?'rgba(84,153,76,.12)':i%3===1?'rgba(37,87,48,.12)':'rgba(125,182,86,.08)'; c.beginPath(); c.ellipse(0,0,rx,ry,0,0,Math.PI*2); c.fill(); c.restore(); } })
    };
  }
  buildSprites(){

    pulse(kind='ui'){
      const a=this.ensure();if(!a)return;const o=a.createOscillator(),g=a.createGain();let f=280,d=.06,type='sine';
      if(kind==='pickup'){f=760;d=.045;type='triangle';}else if(kind==='launch'){f=135;d=.13;type='sawtooth';}else if(kind==='impact'){f=90;d=.08;type='square';}else if(kind==='special'){f=520;d=.18;type='triangle';}else if(kind==='boost'){f=360;d=.08;type='sawtooth';}
      o.type=type;o.frequency.setValueAtTime(f,a.currentTime);if(kind==='launch'||kind==='impact')o.frequency.exponentialRampToValueAtTime(Math.max(45,f*.55),a.currentTime+d);
      g.gain.setValueAtTime(.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(.08,a.currentTime+.008);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);
      o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d+.01);
    }
  }

  class Game{
    constructor(){
      this.renderer=new JL.Renderer(canvas);this.sfx=new SFX();
      this.save={best:+(JL.storage.get('jungleLaunchBest')||0),bananas:+(JL.storage.get('jungleLaunchBananas')||0)};
      this.startX=280;this.seed=JL.hashSeed(Date.now());this.runSerial=0;this.rngVisual=new JL.RNG(this.seed^0xa341316c);
      this.world=new JL.World(this.seed);this.player=new JL.Player(this.startX,JL.CONFIG.GROUND_Y-78);
      this.camera={x:500,y:360,zoom:1};this.state='menu';this.prevState='flight';this.aimAngle=26;this.aimDir=1;this.power=.5;this.powerDir=1;
      this.banner={text:'',sub:'',timer:0};this.screenShake=0;this.freezeTimer=0;this.specialWindow=null;this.particles=[];this.accumulator=0;this.last=performance.now();this.simTime=0;this.debug=false;this.fps=60;this.lastBiome='TREEHOUSE FOREST';this.recordAnnounced=false;this.touchStartY=null;
      this.bindInput();requestAnimationFrame(t=>this.frame(t));
    }
    newSeed(){this.runSerial++;return JL.hashSeed(`${Date.now()}-${this.runSerial}-${this.seed}`);}
    beginRun(newSeed=true){
      if(newSeed)this.seed=this.newSeed();
      this.world.reset(this.seed);this.rngVisual=new JL.RNG(this.seed^0xa341316c);this.player.reset(this.startX,JL.CONFIG.GROUND_Y-78);this.world.spawnAhead(this.player,this.startX,5200);
      this.camera={x:500,y:360,zoom:1};this.state='aim';this.aimAngle=26;this.aimDir=1;this.power=.50;this.powerDir=1;this.banner={text:'AIM',sub:'Click / SPACE to lock launch angle',timer:1.8};this.screenShake=0;this.freezeTimer=0;this.specialWindow=null;this.particles=[];this.accumulator=0;this.simTime=0;this.lastBiome=this.currentBiome().name;this.recordAnnounced=false;
    }
    distance(){return Math.max(0,(this.player.x-this.startX)*JL.CONFIG.METERS_PER_PX);}
    currentBiome(){return this.world.biomeAt(this.distance());}
    showBanner(text,sub,timer=.85){this.banner={text,sub,timer};}
    hitStop(sec){this.freezeTimer=Math.max(this.freezeTimer,sec);}
    audioPulse(kind){this.sfx.pulse(kind);}
    fxBurst(x,y,n,kind){for(let i=0;i<n;i++)this.particles.push({x,y,vx:this.rngVisual.range(-280,280),vy:this.rngVisual.range(-360,80),life:this.rngVisual.range(.35,1.1),s:this.rngVisual.range(2.5,9),kind});}
    impact(text,sub,o,shake,kind,freeze){this.showBanner(text,sub,.88);this.screenShake=Math.max(this.screenShake,shake);this.hitStop(freeze);this.fxBurst(o.x,o.y,26,kind);this.sfx.pulse('impact');}
    activateSpecial(){
      if(!this.specialWindow||this.specialWindow.timer<=0||this.specialWindow.used)return false;
      this.specialWindow.used=true;this.specialWindow.timer=0;
      this.player.vx=Math.min(4500,Math.max(this.player.vx*1.18,3300));this.player.vy=Math.min(this.player.vy,-820);this.player.boosts=Math.min(3,this.player.boosts+1);
      this.showBanner('ANCIENT BLAST!','Perfect reaction — massive launch',1.45);this.hitStop(.11);this.screenShake=18;this.fxBurst(this.player.x,this.player.y,70,'mystic');this.sfx.pulse('special');return true;
    }
    primary(){
      this.sfx.ensure();
      if(this.specialWindow&&this.specialWindow.timer>0){this.activateSpecial();return;}
      if(this.state==='menu'){this.beginRun(true);return;}
      if(this.state==='aim'){this.state='power';this.showBanner('POWER','Hit the red PERFECT zone for maximum launch',1.3);return;}
      if(this.state==='power'){
        const result=this.player.launch(this.aimAngle,this.power);this.state='flight';this.screenShake=result.perfect?11:6;this.fxBurst(this.player.x,this.player.y,30,'dust');this.sfx.pulse('launch');
        if(result.perfect){this.hitStop(.10);this.showBanner('PERFECT LAUNCH!',`${Math.round(result.speed*JL.CONFIG.METERS_PER_PX)} m/s initial speed`,1.45);}else this.showBanner('GO!',`${Math.round(result.speed*JL.CONFIG.METERS_PER_PX)} m/s launch`,1.0);
        return;
      }
      if(this.state==='flight'&&this.player.boost()){this.showBanner('AIR BOOST!',`${this.player.boosts} boost${this.player.boosts===1?'':'s'} left`,.62);this.screenShake=Math.max(this.screenShake,6);this.fxBurst(this.player.x-10,this.player.y+10,18,'speed');this.sfx.pulse('boost');return;}
      if(this.state==='gameover'){this.beginRun(true);return;}
    }
    dive(){if(this.state==='flight'&&this.player.diveNow()){this.screenShake=Math.max(this.screenShake,5);this.fxBurst(this.player.x,this.player.y,16,'water');this.sfx.pulse('boost');}}
    finish(){
      if(this.state!=='flight')return;this.state='gameover';const d=this.distance();if(d>this.save.best){this.save.best=d;JL.storage.set('jungleLaunchBest',d.toFixed(2));}this.save.bananas+=this.player.runBananas;JL.storage.set('jungleLaunchBananas',String(this.save.bananas));this.specialWindow=null;
    }
    updateMenu(dt){
      if(this.state==='aim'){this.aimAngle+=this.aimDir*44*dt;if(this.aimAngle>JL.CONFIG.LAUNCH.maxAngle){this.aimAngle=JL.CONFIG.LAUNCH.maxAngle;this.aimDir=-1;}if(this.aimAngle<JL.CONFIG.LAUNCH.minAngle){this.aimAngle=JL.CONFIG.LAUNCH.minAngle;this.aimDir=1;}}
      if(this.state==='power'){this.power+=this.powerDir*1.20*dt;if(this.power>1){this.power=1;this.powerDir=-1;}if(this.power<.06){this.power=.06;this.powerDir=1;}}
      if(this.banner.timer>0)this.banner.timer=Math.max(0,this.banner.timer-dt);
    }
    fixedStep(dt){
      if(this.state!=='flight')return;
      this.simTime+=dt;
      if(this.specialWindow){this.specialWindow.timer=Math.max(0,this.specialWindow.timer-dt);if(this.specialWindow.timer===0&&!this.specialWindow.used){this.showBanner('SPECIAL MISSED','Normal flight continues',.7);this.specialWindow=null;}}
      const impact=this.player.step(dt,this.world);
      if(impact&&impact.groundImpact){this.screenShake=Math.max(this.screenShake,JL.clamp(impact.impact/95,3,14));this.fxBurst(this.player.x,this.world.groundAt(this.player.x)-3,Math.min(28,Math.max(8,(impact.impact/50)|0)),impact.surface.type==='water'?'water':'dust');if(impact.surface.type==='rock'&&impact.impact>450)this.showBanner('ROCK SKIP!','Hard surface keeps momentum',.55);}

      // swept sensor collision: catches encounters even when crossing them between high-speed physics steps
      for(const o of this.world.objects){
        if(o.hit)continue;
        if(o.x<this.player.px-120||o.x>this.player.x+140)continue;
        if(JL.segmentCircleHit(this.player.px,this.player.py,this.player.x,this.player.y,o.x,o.y,this.player.r+o.r+6))JL.resolveEncounter(this.player,o,this);
      }
      this.world.spawnAhead(this.player,this.startX,5200);this.world.cleanup(this.camera.x);
      this.updateCamera(dt);this.updateParticles(dt);

      const biome=this.currentBiome().name;if(biome!==this.lastBiome){this.lastBiome=biome;this.showBanner(biome,'NEW BIOME',1.4);this.fxBurst(this.player.x,this.player.y,34,'leaf');}
      if(!this.recordAnnounced&&this.save.best>0&&this.distance()>this.save.best){this.recordAnnounced=true;this.showBanner('NEW RECORD!',`${this.distance().toFixed(1)} m and climbing`,1.2);this.fxBurst(this.player.x,this.player.y,38,'banana');this.sfx.pulse('special');}

      const gy=this.world.groundAt(this.player.x);
      if(this.player.x>this.startX+700&&this.player.vx<95&&this.player.y>=gy-this.player.r-4&&Math.abs(this.player.vy)<140)this.finish();
      if(this.player.y>JL.CONFIG.HEIGHT+850)this.finish();
    }
    updateCamera(dt){
      const speed=Math.max(0,this.player.vx*JL.CONFIG.METERS_PER_PX);const s=JL.clamp((speed-60)/220,0,1);const targetZoom=JL.lerp(JL.CONFIG.CAMERA.zoomMax,JL.CONFIG.CAMERA.zoomMin,s);this.camera.zoom=JL.lerp(this.camera.zoom,targetZoom,1-Math.pow(.0008,dt));
      const lead=JL.lerp(JL.CONFIG.CAMERA.baseLead,JL.CONFIG.CAMERA.fastLead,s);const targetX=this.player.x+(0.5-lead)*JL.CONFIG.WIDTH/this.camera.zoom;this.camera.x=JL.lerp(this.camera.x,targetX,1-Math.pow(.0007,dt));
      const altitude=JL.CONFIG.GROUND_Y-this.player.y;const t=JL.clamp((altitude-100)/420,0,1);const targetY=JL.lerp(360,this.player.y+20,t);this.camera.y=JL.lerp(this.camera.y,targetY,1-Math.pow(.0012,dt));
    }
    updateParticles(dt){for(const p of this.particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.kind==='leaf'||p.kind==='feather'?180:500)*dt;p.vx*=Math.pow(.985,dt*60);}this.particles=this.particles.filter(p=>p.life>0);this.screenShake=Math.max(0,this.screenShake-dt*25);}
    frame(now){
      let dt=Math.min(JL.CONFIG.MAX_FRAME_DT,(now-this.last)/1000||0);this.last=now;this.fps=this.fps*.9+(dt>0?1/dt:60)*.1;this.updateMenu(dt);
      if(this.state!=='paused'){
        if(this.freezeTimer>0){this.freezeTimer=Math.max(0,this.freezeTimer-dt);this.updateParticles(dt*.15);}
        else{this.accumulator+=dt;let guard=0;while(this.accumulator>=JL.CONFIG.FIXED_DT&&guard++<12){this.fixedStep(JL.CONFIG.FIXED_DT);this.accumulator-=JL.CONFIG.FIXED_DT;if(this.freezeTimer>0){this.accumulator=0;break;}}}
      }
      this.renderer.draw(this);requestAnimationFrame(t=>this.frame(t));
    }
    bindInput(){
      window.addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();if(['Space','KeyW','ArrowUp'].includes(e.code))this.primary();if(['ShiftLeft','ShiftRight','KeyS','ArrowDown'].includes(e.code))this.dive();if(e.code==='KeyP'){if(this.state==='paused')this.state=this.prevState||'flight';else if(!['menu','gameover'].includes(this.state)){this.prevState=this.state;this.state='paused';}}if(e.code==='KeyR')this.beginRun(false);if(e.code==='F2'){e.preventDefault();this.debug=!this.debug;}});
      canvas.addEventListener('pointerdown',e=>{this.sfx.ensure();this.touchStartY=e.clientY;if(e.pointerType==='touch')return;if(e.button===2){this.dive();return;}this.primary();});
      canvas.addEventListener('pointerup',e=>{if(e.pointerType==='touch'){const dy=this.touchStartY==null?0:e.clientY-this.touchStartY;if(dy>55)this.dive();else this.primary();}this.touchStartY=null;});
      canvas.addEventListener('contextmenu',e=>e.preventDefault());
    }
  }

  window.game=new Game();
})();


</script>
</body>
</html>
